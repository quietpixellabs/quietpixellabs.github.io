<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Quiet Pixel Labs mark</title>
  <desc id="desc">Two softly offset pixel frames with a warm orange center pixel.</desc>
  <rect width="256" height="256" rx="56" fill="#f5f1e8"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="48" y="48" width="112" height="112" rx="28" stroke="#25241f" stroke-width="14" transform="rotate(-4 104 104)"/>
    <rect x="96" y="96" width="112" height="112" rx="24" stroke="#e86f3b" stroke-width="14" transform="rotate(4 152 152)"/>
  </g>
  <rect x="111" y="111" width="34" height="34" rx="8" fill="#627b65"/>
  <rect x="122" y="122" width="12" height="12" rx="3" fill="#f5f1e8"/>
</svg>
